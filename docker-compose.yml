services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lncrawl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: lncrawl
    volumes:
      - pgdata2:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lncrawl"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    environment:
      - PYTHONUNBUFFERED=1
      - LNCRAWL_DATA_PATH=/data
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DB_HOST=postgres
      - LNCRAWL_ADMIN_EMAIL=${LNCRAWL_ADMIN_EMAIL:-admin}
      - LNCRAWL_ADMIN_PASSWORD=${LNCRAWL_ADMIN_PASSWORD:-admin}
      - LNCRAWL_TOKEN_SECRET=${LNCRAWL_TOKEN_SECRET:-}
      - LNCRAWL_BASE_URL=${LNCRAWL_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata2:
  appdata:
